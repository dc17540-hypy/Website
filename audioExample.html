<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D3 US Map with Clickable Points</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/topojson.v3.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { width: 100%; height: 100vh; }

    .tooltip {
      position: absolute;
      background: white;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      pointer-events: auto;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      max-width: 240px;
    }

    .tooltip img {
      width: 100%;
      border-radius: 4px;
      margin-top: 6px;
    }

    .tooltip button {
      margin-top: 8px;
      padding: 6px 10px;
      border: none;
      background: #007BFF;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("#map")
  .append("svg")
  .attr("width", width)
  .attr("height", height);

const projection = d3.geoAlbersUsa()
  .translate([width / 2, height / 2])
  .scale(1200);

const path = d3.geoPath().projection(projection);

const tooltip = d3.select("body")
  .append("div")
  .attr("class", "tooltip")
  .style("opacity", 0);

// Sample audio (replace with your own file if needed)
const sampleAudio = "Heart.mp3";

const points = [
  { 
    name: "Doechii (Tampa, FL)", 
    coords: [-82.4572, 27.9506], 
    info: "Doechii is a rapper and singer.",
    img: "test.png",
    audio: sampleAudio
  }
];

d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {
  const states = topojson.feature(us, us.objects.states);

  svg.selectAll("path")
    .data(states.features)
    .enter()
    .append("path")
    .attr("d", path)
    .attr("fill", "#e0e0e0")
    .attr("stroke", "#999");

  svg.selectAll("circle")
    .data(points)
    .enter()
    .append("circle")
    .attr("cx", d => projection(d.coords)[0])
    .attr("cy", d => projection(d.coords)[1])
    .attr("r", 6)
    .attr("fill", "blue")
    .style("cursor", "pointer")
    .on("click", function(event, d) {
      tooltip.transition().duration(200).style("opacity", 1);

      const content = `
        <strong>${d.name}</strong><br>
        ${d.info}
        <img src="${d.img}" alt="Doechii">
        <button onclick="playAudio('${d.audio}')">▶ Play Music</button>
      `;

      tooltip
        .html(content)
        .style("left", (event.pageX + 10) + "px")
        .style("top", (event.pageY - 20) + "px");
    });
});

// Global audio player
let audioPlayer = new Audio();

function playAudio(src) {
  audioPlayer.pause();
  audioPlayer = new Audio(src);
  audioPlayer.play();
}
</script>

</body>
</html>
