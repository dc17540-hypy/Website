<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D3 US Map with Clickable Points</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/topojson.v3.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .tooltip {
      position: absolute;
      background: white;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      pointer-events: none;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("#map")
  .append("svg")
  .attr("width", width)
  .attr("height", height);

// Projection
const projection = d3.geoAlbersUsa()
  .translate([width / 2, height / 2])
  .scale(1200);

const path = d3.geoPath().projection(projection);

// Tooltip
const tooltip = d3.select("body")
  .append("div")
  .attr("class", "tooltip")
  .style("opacity", 0);

// Sample point data
const points = [
 { 
    name: "Doechii (Tampa, FL)", 
    coords: [-82.4572, 27.9506], 
    info: "Doechii is an rapper and singer.",
  },
  { name: "New York", coords: [-74.006, 40.7128], info: "Population: 8.5M" },
  { name: "Los Angeles", coords: [-118.2437, 34.0522], info: "Population: 4M" },
  { name: "Chicago", coords: [-87.6298, 41.8781], info: "Population: 2.7M" }
];

// Load US GeoJSON
d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json").then(us => {
  const states = topojson.feature(us, us.objects.states);

  // Draw states
  svg.selectAll("path")
    .data(states.features)
    .enter()
    .append("path")
    .attr("d", path)
    .attr("fill", "#e0e0e0")
    .attr("stroke", "#999");

  // Draw points
  svg.selectAll("circle")
    .data(points)
    .enter()
    .append("circle")
    .attr("cx", d => projection(d.coords)[0])
    .attr("cy", d => projection(d.coords)[1])
    .attr("r", 6)
    .attr("fill", "red")
    .style("cursor", "pointer")

    .on("click", function(event, d) {
      tooltip.transition().duration(200).style("opacity", 1);
      tooltip
        .html(`<strong>${d.name}</strong><br>${d.info}`)
        .style("left", (event.pageX + 10) + "px")
        .style("top", (event.pageY - 20) + "px");
    });
});
</script>

</body>
</html>
